services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Free Tier)
  # ---------------------------------------------------------------------------
  - type: web
    name: fintrack-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fintrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: DEMO_USER_EMAIL
        value: demo@example.com
      - key: DEMO_USER_PASSWORD
        value: Demo@12345

  # ---------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site (Free Tier)
  # ---------------------------------------------------------------------------
  - type: static
    name: fintrack-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: fintrack-backend
          property: host
          value: https://fintrack-backend.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: FinTrack

# -----------------------------------------------------------------------------
# 3. PostgreSQL Managed Database (Free Tier)
# -----------------------------------------------------------------------------
databases:
  - name: fintrack-db
    databaseName: expense_tracker
    user: app_user
    plan: free
